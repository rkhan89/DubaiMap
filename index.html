<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koko</title>
<meta name="description" content="Koko: we were here. A shared food scrapbook map of Dubai for you and your crew.">
<meta name="theme-color" content="#FFF4E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1410" media="(prefers-color-scheme: dark)">
<script>/* theme before first paint (same rule as theme.js) */try{var p=localStorage.getItem("bites-theme"),d=p==="dark"||(p!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light";if(p==="light"||p==="dark")document.querySelectorAll("meta[name=theme-color]").forEach(function(m){m.content=d?"#1C1410":"#FFF4E8";});}catch(e){document.documentElement.dataset.theme="light";}</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<!-- link previews: absolute URLs on APP.siteUrl (config.js); tests/branding.test.mjs keeps them in step -->
<meta property="og:title" content="Koko">
<meta property="og:description" content="We were here. A shared food scrapbook map of Dubai for you and your crew.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://dubai-bites-pi.vercel.app/">
<meta property="og:image" content="https://dubai-bites-pi.vercel.app/social/og-image-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Koko">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://dubai-bites-pi.vercel.app/social/og-image-1200x630.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,700;6..12,800;6..12,900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Silkscreen&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="legal.css">
</head>
<body>
<div id="app" class="app">

  <header class="app-header">
    <div class="brand">
      <div><h1 class="brand-name"><span class="wordmark" id="brandName" role="img" aria-label="Koko"></span></h1><span class="hand" id="brandTag"></span></div>
    </div>
    <button class="icon-btn bell-btn" id="btnBell" aria-label="Crew activity"><span class="ms">notifications</span><i class="bell-dot" hidden></i></button>
    <button class="profile-btn" data-act="profile" aria-label="Your profile"></button>
  </header>

  <main id="views">
    <!-- MAP -->
    <section id="mapView" class="view active">
      <div class="map-wrap" id="mapWrap">
        <canvas id="mapCanvas" aria-label="Isometric map of Dubai"></canvas>
        <div id="mapOverlay"></div>

        <div class="map-top map-ui">
          <div class="seg seg-mode" id="mapMode"></div>
          <button class="map-filter" id="btnFilter" aria-label="Filters"><span class="ms">tune</span></button>
        </div>

        <div class="map-ctrl map-ui">
          <button id="btnFit" aria-label="Show all places"><span class="ms">fit_screen</span></button>
          <button id="btnLocate" aria-label="Show my location"><span class="ms">my_location</span></button>
        </div>

        <div class="mem-strip map-ui" id="memStrip" hidden></div>
        <div class="peek map-ui" id="peek" hidden></div>

        <div class="pick-ui" id="pickUI">
          <div class="pick-hint">Drag the map to line up the stamp</div>
          <div class="pick-marker" aria-hidden="true"><span class="stamp st-visited big"><span class="st-paper"><span class="st-ico ms">push_pin</span></span></span><span class="pick-shadow"></span></div>
          <div class="pick-actions map-ui">
            <button class="btn btn-soft" id="pickCancel">Cancel</button>
            <button class="btn btn-gold" id="pickConfirm">Set location</button>
          </div>
        </div>
        <div class="map-loading" id="mapLoading"><span class="brand-pin" aria-hidden="true"></span><span>Building Dubai…</span></div>
      </div>
    </section>

    <!-- LIST -->
    <section id="listView" class="view"></section>
  </main>

  <nav class="bottomnav" id="nav">
    <button data-tab="map" class="on"><span class="ms">map</span><span>Map</span></button>
    <button data-tab="list"><span class="ms">format_list_bulleted</span><span>List</span></button>
    <button class="nav-log" id="navLog" aria-label="Log a place"><span class="ms">add</span></button>
    <button data-tab="crew"><span class="ms">group</span><span>Crew</span></button>
    <button data-tab="shelf"><span class="ms">auto_stories</span><span>Shelf</span></button>
  </nav>
</div>

<div id="screens"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="points" class="points-toast" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
