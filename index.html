<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dubai Bites</title>
<meta name="description" content="A shared scrapbook map of the best food, coffee and desserts in Dubai.">
<meta name="theme-color" content="#fff8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,700;6..12,800;6..12,900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Caveat:wght@600;700&family=Silkscreen&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app">

  <header class="app-header">
    <div class="brand">
      <img class="brand-logo" src="logo.svg" alt="" width="44" height="44">
      <div><h1 id="brandName"></h1><span class="hand" id="brandTag"></span></div>
    </div>
    <button class="round-btn" id="btnFilter" aria-label="Filters"><span class="ms">tune</span></button>
    <button class="profile-btn" data-act="profile" aria-label="Your profile"></button>
  </header>

  <main id="views">
    <!-- MAP -->
    <section id="mapView" class="view active">
      <div class="map-wrap" id="mapWrap">
        <canvas id="mapCanvas" aria-label="Isometric map of Dubai"></canvas>
        <div id="mapOverlay"></div>

        <div class="map-top map-ui">
          <div class="map-top-row">
            <div class="seg seg-mode" id="mapMode"></div>
            <button class="loc-pill" id="locPill"><span class="ms">near_me</span><span id="locPillText">Dubai</span></button>
          </div>
          <div class="member-row scrolls" id="memberRow"></div>
          <div class="me-note-line" id="meNoteLine"></div>
          <button class="ticker" id="ticker" hidden></button>
        </div>

        <div class="map-ctrl map-ui">
          <button id="zoomIn" aria-label="Zoom in"><span class="ms">add</span></button>
          <button id="zoomOut" aria-label="Zoom out"><span class="ms">remove</span></button>
          <button id="btnFit" aria-label="Show all places"><span class="ms">fit_screen</span></button>
          <button id="btnLocate" aria-label="Show my location"><span class="ms">my_location</span></button>
        </div>

        <button class="crew-bar map-ui" id="crewBar" hidden></button>
        <div class="peek map-ui" id="peek" hidden></div>

        <div class="pick-ui" id="pickUI">
          <div class="pick-hint">Drag the map to line up the stamp</div>
          <div class="pick-marker" aria-hidden="true"><span class="stamp st-visited big"><span class="st-paper"><span class="st-ico ms">push_pin</span></span></span><span class="pick-shadow"></span></div>
          <div class="pick-actions map-ui">
            <button class="btn btn-soft" id="pickCancel">Cancel</button>
            <button class="btn btn-gold" id="pickConfirm">Set location</button>
          </div>
        </div>
        <div class="map-loading" id="mapLoading"><span>Building Dubai…</span></div>
      </div>
    </section>

    <!-- LIST -->
    <section id="listView" class="view"></section>
  </main>

  <nav class="bottomnav" id="nav">
    <button data-tab="map" class="on"><span class="ms">map</span><span>Map</span></button>
    <button data-tab="list"><span class="ms">format_list_bulleted</span><span>List</span></button>
    <button class="nav-log" id="navLog" aria-label="Log a place"><span class="ms">add</span></button>
    <button data-tab="crew"><span class="ms">group</span><span>Crew</span></button>
    <button data-tab="shelf"><span class="ms">auto_stories</span><span>Shelf</span></button>
  </nav>
</div>

<div id="screens"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="points" class="points-toast" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
