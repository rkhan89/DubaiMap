rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"space-lg":"1.5rem","space-sm":"0.5rem","space-xs":"0.25rem","space-xl":"2rem",margin:"1.25rem","space-md":"1rem",gutter:"1rem"},fontFamily:{"body-sm":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"headline-xl":["Nunito Sans"],"headline-lg":["Nunito Sans"],"label-md":["Space Mono"],"label-lg":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"headline-md":["Nunito Sans"],"headline-xl-mobile":["Nunito Sans"],"label-sm":["Space Mono"],"headline-sm":["Nunito Sans"],caption:["Caveat"]},fontSize:{"body-sm":["13px",{lineHeight:"18px",fontWeight:"400"}],"body-lg":["16px",{lineHeight:"24px",fontWeight:"500"}],"headline-xl":["34px",{lineHeight:"42px",fontWeight:"800"}],"headline-lg":["26px",{lineHeight:"34px",fontWeight:"700"}],"label-md":["11px",{lineHeight:"16px",letterSpacing:"0.06em",fontWeight:"700"}],"label-lg":["14px",{lineHeight:"18px",fontWeight:"600"}],"body-md":["14px",{lineHeight:"21px",fontWeight:"400"}],"headline-md":["20px",{lineHeight:"28px",fontWeight:"700"}],"headline-xl-mobile":["28px",{lineHeight:"36px",fontWeight:"800"}],"label-sm":["10px",{lineHeight:"14px",letterSpacing:"0.04em",fontWeight:"400"}],"headline-sm":["18px",{lineHeight:"24px",fontWeight:"700"}],caption:["18px",{lineHeight:"22px",fontWeight:"600"}]}}}};</script></head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full pb-safe">
<!-- Top Navigation Bar -->
<div class="flex items-center justify-between px-margin py-space-sm bg-surface">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-high text-on-surface active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<span class="font-headline-sm text-headline-sm text-on-surface">Make a Sticker</span>
<span class="font-label-sm text-label-sm text-secondary tracking-widest uppercase">Step 1 of 2</span>
</div>
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-low text-secondary">
<span class="material-symbols-outlined text-[18px]">auto_fix_high</span>
</div>
</div>
<!-- Stage 1: AI Cutout Isolation Chamber -->
<div class="px-margin pt-space-xs pb-space-sm">
<div class="relative w-full rounded-xl overflow-hidden bg-surface-container shadow-md">
<!-- Original Dish Photo Container -->
<div class="relative w-full h-[270px]">
<img alt="Gourmet smash burger with melted cheddar and caramelized onions" class="w-full h-full object-cover filter brightness-[0.92] contrast-[1.05]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDwH_uabWb5SgG9toURspYTUhun5tIvgQlQKbr0fBXGhaagTiEV3vK2udZfUtF2MuCiDL1ClSJe5pB7OF9EHEE2OhN3CGapTD4fy0fmKEX87UgMTa-dttgq0DwrCn4929u8WPvGJr_0IAa14Fzsh2wE6xwAqYS-_J67xRWXoPBfAdIRqACgGb7u46kMfkfbGPjk-nCFvkgbWBkarPAJLJL1bQFu2HeDhne1HQ4ie5GGIDbXYzgKO-xvw"/>
<!-- Dimming Scrim for non-subject plate context -->
<div class="absolute inset-0 bg-inverse-surface/35 pointer-events-none"></div>
<!-- Glowing AI Isolation Contour overlay around Smash Burger -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" fill="none" viewbox="0 0 350 270">
<defs>
<filter height="140%" id="sticker-glow" width="140%" x="-20%" y="-20%">
<fegaussianblur in="SourceGraphic" result="blur" stddeviation="3.5"></fegaussianblur>
<femerge>
<femergenode in="blur"></femergenode>
<femergenode in="SourceGraphic"></femergenode>
</femerge>
</filter>
<lineargradient id="contourGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF"></stop>
<stop offset="50%" stop-color="#FEB383"></stop>
<stop offset="100%" stop-color="#E5A93C"></stop>
</lineargradient>
</defs>
<!-- Outer Dynamic Lifting Shadow -->
<ellipse cx="175" cy="208" fill="#291709" fill-opacity="0.32" rx="78" ry="14"></ellipse>
<!-- Pulsing Animated Traced Perimeter -->
<path class="animate-pulse" d="M 125 78 C 145 68, 205 68, 226 79 C 238 86, 246 100, 245 116 C 248 126, 252 142, 244 153 C 242 165, 237 172, 226 179 C 215 186, 192 189, 175 190 C 152 189, 134 185, 122 178 C 112 171, 107 160, 105 148 C 101 133, 105 119, 110 108 C 114 96, 117 84, 125 78 Z" filter="url(#sticker-glow)" stroke="url(#contourGrad)" stroke-dasharray="6 4" stroke-linecap="round" stroke-width="3.5"></path>
<!-- Optical Sensory Anchor Points -->
<circle cx="125" cy="78" fill="#FFFFFF" r="3.5"></circle>
<circle cx="226" cy="79" fill="#FEB383" r="3.5"></circle>
<circle cx="244" cy="153" fill="#E5A93C" r="3.5"></circle>
<circle cx="175" cy="190" fill="#FFFFFF" r="3.5"></circle>
<circle cx="105" cy="148" fill="#FEB383" r="3.5"></circle>
<!-- Dynamic Lift Particle Sparkles -->
<path d="M 92 100 L 95 106 L 101 109 L 95 112 L 92 118 L 89 112 L 83 109 L 89 106 Z" fill="#FFF1E9" fill-opacity="0.9"></path>
<path d="M 258 92 L 260 97 L 265 99 L 260 101 L 258 106 L 256 101 L 251 99 L 256 97 Z" fill="#E5A93C"></path>
<path d="M 238 184 L 240 188 L 244 190 L 240 192 L 238 196 L 236 192 L 232 190 L 236 188 Z" fill="#FFF8F5"></path>
</svg>
<!-- Status Badge Pin -->
<div class="absolute top-3 left-3 bg-surface-container-lowest/90 px-3 py-1.5 rounded-full shadow-sm flex items-center space-x-1.5 backdrop-blur-sm">
<span class="w-2 h-2 rounded-full bg-tertiary animate-ping"></span>
<span class="font-label-md text-label-md text-on-surface uppercase tracking-wider">Subject Isolated</span>
</div>
<div class="absolute bottom-3 right-3 bg-inverse-surface/85 px-2.5 py-1 rounded-md text-inverse-on-surface font-label-sm text-label-sm tracking-wide">
          SMART CUTOUT 2.4x
        </div>
</div>
</div>
</div>
<!-- Stage 2: Tactile Crafting Cutting Mat & Physical Die-Cut Sticker -->
<div class="px-margin">
<div class="relative w-full rounded-xl bg-surface-container-low p-space-md shadow-inner overflow-hidden">
<!-- Tactile Mat Grid Pattern -->
<div class="absolute inset-0 pointer-events-none opacity-25" style="background-image: radial-gradient(#827563 0.75px, transparent 0.75px), linear-gradient(to right, #d4c4b0 0.5px, transparent 0.5px), linear-gradient(to bottom, #d4c4b0 0.5px, transparent 0.5px); background-size: 16px 16px, 16px 16px, 16px 16px;"></div>
<!-- Section Label & Crafting Metric -->
<div class="relative z-10 flex items-center justify-between mb-space-sm">
<div class="flex items-center space-x-1.5">
<span class="material-symbols-outlined text-[16px] text-secondary">content_cut</span>
<span class="font-caption text-caption text-secondary">Generated die-cut sticker</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container px-2 py-0.5 rounded">
          VINYL FINISH · 300 DPI
        </span>
</div>
<!-- Centered Physical Sticker Preview with Thick Die-Cut Border & Tilt -->
<div class="relative z-10 flex items-center justify-center py-space-sm">
<div class="relative cursor-pointer transition-transform duration-200 active:scale-95" id="stickerToken" style="transform: rotate(3deg);">
<!-- Peel Tab Motif (Top-Left) -->
<div class="absolute -top-2.5 -left-2 z-20 w-5 h-5 bg-surface-container-highest rounded-tl-sm rounded-br-lg shadow-sm transform -rotate-12 opacity-85"></div>
<!-- Physical Die-Cut Vinyl Sticker Shell -->
<div class="relative rounded-[28px] p-[5px] bg-surface-container-lowest shadow-xl" style="box-shadow: 0 10px 20px -3px rgba(41, 23, 9, 0.22), 0 4px 6px -2px rgba(41, 23, 9, 0.12);">
<!-- Cutout Image Mask Frame -->
<div class="w-36 h-36 rounded-[24px] overflow-hidden bg-surface-container-highest relative">
<img alt="Isolated burger cutout" class="w-[170%] h-[170%] max-w-none object-cover absolute" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCDwH_uabWb5SgG9toURspYTUhun5tIvgQlQKbr0fBXGhaagTiEV3vK2udZfUtF2MuCiDL1ClSJe5pB7OF9EHEE2OhN3CGapTD4fy0fmKEX87UgMTa-dttgq0DwrCn4929u8WPvGJr_0IAa14Fzsh2wE6xwAqYS-_J67xRWXoPBfAdIRqACgGb7u46kMfkfbGPjk-nCFvkgbWBkarPAJLJL1bQFu2HeDhne1HQ4ie5GGIDbXYzgKO-xvw" style="top: -38%; left: -34%;"/>
<!-- Gloss Sheen Reflection -->
<div class="absolute inset-0 bg-gradient-to-tr from-transparent via-surface-container-lowest/25 to-surface-container-lowest/60 pointer-events-none"></div>
</div>
<!-- Authentic Stamp Edge Dot Indicator -->
<div class="absolute bottom-1.5 right-2 flex items-center space-x-1 opacity-70">
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
<span class="font-label-sm text-[8px] text-on-surface-variant">KOKO</span>
</div>
</div>
</div>
</div>
<!-- Interactive Micro-Notice -->
<p class="relative z-10 text-center font-body-sm text-body-sm text-on-surface-variant pt-space-xs">
        Tap sticker to audition placement preview
      </p>
</div>
</div>
<!-- Action Controls -->
<div class="px-margin pt-space-md flex flex-col space-y-space-sm">
<!-- Primary CTA: Mustard Tactile Button -->
<button class="w-full h-12 bg-primary-container text-on-primary-fixed rounded-xl font-headline-sm text-headline-sm flex items-center justify-center space-x-2 shadow-md active:translate-y-0.5 transition-all" id="addToPageBtn" style="box-shadow: 0 3px 0 #7e5700;" type="button">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
<span>Add to page</span>
</button>
<!-- Secondary CTA: Cream Card with Dashed Accent -->
<button class="w-full h-11 bg-surface-container-lowest text-secondary rounded-xl font-label-lg text-label-lg flex items-center justify-center space-x-2 shadow-sm active:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined text-[18px]">bookmark_add</span>
<span>Save to Mine</span>
</button>
<!-- Ghost Auxiliary Action -->
<div class="flex justify-center pt-space-xs">
<button class="text-secondary font-body-md text-body-md underline underline-offset-4 active:opacity-70 transition-opacity" type="button">
        Try again
      </button>
</div>
</div>
<!-- Privacy Handshake Guarantee -->
<div class="px-margin pt-space-md pb-space-sm flex items-center justify-center space-x-1.5 text-center">
<span class="material-symbols-outlined text-[14px] text-outline">lock</span>
<span class="font-label-sm text-label-sm text-outline tracking-tight">
      Cutouts stay on your phone · Never uploaded to servers
    </span>
</div>
</div>
<script>
  (function initCutoutStudio() {
    const sticker = document.getElementById('stickerToken');
    const addBtn = document.getElementById('addToPageBtn');
    let angle = 3;

    if (sticker) {
      sticker.addEventListener('click', () => {
        angle = angle === 3 ? -3 : 3;
        sticker.style.transform = `rotate(${angle}deg) scale(1.04)`;
        setTimeout(() => {
          sticker.style.transform = `rotate(${angle}deg) scale(1.0)`;
        }, 150);
      });
    }

    if (addBtn) {
      addBtn.addEventListener('click', () => {
        addBtn.style.transform = 'translateY(2px)';
        addBtn.style.boxShadow = '0 1px 0 #7e5700';
        setTimeout(() => {
          addBtn.style.transform = '';
          addBtn.style.boxShadow = '0 3px 0 #7e5700';
        }, 180);
      });
    }
  })();
</script></main></body></html>
